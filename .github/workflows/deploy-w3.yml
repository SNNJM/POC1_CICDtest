
name: Smart Detailing W3 CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - "gitops/**"
  workflow_dispatch:

concurrency:
  group: smart-detailing-w3-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: write

env:
  ACR_NAME: smartpharma
  ACR_LOGIN_SERVER: smartpharma.azurecr.io
  IMAGE_NAME: smart-detailing-w3

jobs:
  build-and-deploy:
    name: Build, Push and Update GitOps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Validate Python syntax
        run: python3 -m py_compile w3_test.py

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          TOKEN=$(az acr login \
            --name "$ACR_NAME" \
            --expose-token \
            --query accessToken \
            -o tsv)

          echo "$TOKEN" | docker login "$ACR_LOGIN_SERVER" \
            --username 00000000-0000-0000-0000-000000000000 \
            --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}" \
            .

      - name: Push Docker image to ACR
        run: |
          docker push \
            "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"

      - name: Update GitOps manifest
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail

          SHORT_SHA="${IMAGE_TAG:0:7}"

          sed -i -E \
            "s/name: smart-detailing-w3-[a-z0-9]+/name: smart-detailing-w3-${SHORT_SHA}/" \
            gitops/w3-job.yaml

          sed -i -E \
            "s|image: smartpharma.azurecr.io/smart-detailing-w3:[a-zA-Z0-9._-]+|image: smartpharma.azurecr.io/smart-detailing-w3:${IMAGE_TAG}|" \
            gitops/w3-job.yaml

          echo "Updated GitOps manifest:"
          grep -E 'name: smart-detailing-w3-|image: smartpharma.azurecr.io/smart-detailing-w3:' gitops/w3-job.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add gitops/w3-job.yaml

          if git diff --cached --quiet; then
            echo "GitOps manifest is already up to date."
          else
            git commit -m "ci: deploy W3 image ${SHORT_SHA}"
            git push origin HEAD:main
          fi

      - name: Display image information
        run: |
          echo "Successfully pushed:"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"
          echo "GitOps manifest updated for Flux CD."
